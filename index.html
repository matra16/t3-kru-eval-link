<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ระบบประเมินสมรรถนะวิชาชีพครู — T3 KRU-EVAL</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1d2433;--muted:#5f6b85;--line:#dfe6f1;--pri:#0d6efd;--ok:#198754}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif}
.wrap{max-width:920px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#0d6efd,#6610f2);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:12px}
.hero h1{margin:0;font-size:20px}.hero small{white-space:pre-line}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.step{flex:1;min-width:90px;text-align:center;padding:8px;border-radius:9px;background:#eef2fb;color:#0b3d91;font-size:12px}.step.on{background:#0b3d91;color:#fff}.step.done{background:#d1e7dd;color:#0a3622}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:15px}button{padding:11px 16px;border:0;border-radius:9px;background:var(--pri);color:#fff;font-weight:700;cursor:pointer}button.ghost{background:#fff;color:#0b3d91;border:1px solid #0b3d91}button:disabled{opacity:.5}
.screen{display:none}.screen.on{display:block}.mentor-row{display:flex;justify-content:space-between;padding:11px;border-bottom:1px solid var(--line);cursor:pointer}.mentor-row:hover{background:#f4f7ff}.mentor-list{border:1px solid var(--line);border-radius:10px;max-height:360px;overflow:auto}
.sec{margin:14px 0}.sec h3{font-size:14px;color:#0b3d91;background:#eef2fb;padding:9px 11px;border-radius:9px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.qcode{font-weight:800;color:#0b3d91}.scale{display:flex;gap:4px}.scale button{background:#f1f4fa;color:#334;border:1px solid var(--line);min-width:44px;padding:8px 6px}.scale button.on{background:#0d6efd;color:#fff}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell{text-align:center;background:#f8fafc;border-radius:9px;padding:8px}.v{font-weight:800;font-size:18px;color:#0b3d91}.k{font-size:11px;color:var(--muted)}.help{font-size:12px;color:var(--muted)}.review{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:7px 0}.success{text-align:center;font-size:54px;color:var(--ok)}
@media(max-width:600px){.item{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.step{min-width:60px}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>ระบบประเมินสมรรถนะวิชาชีพครู</h1><small id="school">กำลังโหลดข้อมูล...</small></div>
<div class="steps" id="steps"></div>
<div class="screen on" id="s1"><div class="card"><input id="search" placeholder="ค้นหารหัสหรือชื่อครูพี่เลี้ยง"><div id="mentors" class="mentor-list" style="margin-top:8px"></div></div></div>
<div class="screen" id="s2"><div class="card"><div id="chosen" style="margin-bottom:10px"></div><select id="student"></select><div id="dup" class="help" style="margin-top:8px"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="ghost" onclick="go(1)">← กลับ</button><button id="to3" disabled>ถัดไป → แบบประเมิน</button></div></div></div>
<div class="screen" id="s3"><div id="rubric"></div><div class="card"><div class="summary"><div class="cell"><div class="v"><span id="rated">0</span>/25</div><div class="k">ตอบแล้ว</div></div><div class="cell"><div class="v" id="work">0/60</div><div class="k">ปฏิบัติงาน</div></div><div class="cell"><div class="v" id="conduct">0/40</div><div class="k">ปฏิบัติตน</div></div><div class="cell"><div class="v" id="total">0/100</div><div class="k">รวม</div></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="ghost" onclick="go(2)">← กลับ</button><button id="to4" disabled>ถัดไป → ตรวจสอบ</button></div></div></div>
<div class="screen" id="s4"><div class="card"><div class="review"><span>ผู้ประเมิน</span><span id="rvMentor"></span></div><div class="review"><span>ผู้รับการประเมิน</span><span id="rvStudent"></span></div><div class="review"><span>คะแนนรวม</span><span id="rvTotal"></span></div><div class="review"><span>ค่าเฉลี่ย</span><span id="rvAvg"></span></div><label style="display:flex;gap:8px;margin-top:14px"><input id="cert" type="checkbox" style="width:auto"> <span id="certText"></span></label><div style="display:flex;gap:8px;margin-top:14px"><button class="ghost" onclick="go(3)">← แก้ไข</button><button id="submit" disabled>ส่งผลการประเมิน</button></div><div id="msg" class="help" style="margin-top:10px"></div></div></div>
<div class="screen" id="s5"><div class="card"><div class="success">✓</div><h2 style="text-align:center">บันทึกผลเรียบร้อย</h2><div id="done" style="text-align:center"></div></div></div>
</div>
<iframe name="bridgeFrame" id="bridgeFrame" style="display:none"></iframe>
<form id="bridgeForm" method="post" target="bridgeFrame" style="display:none"></form>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbxFsBdn9l-R8QUVGBTiGwMxqLIe3SITdA3WckYROin2w9NLkl-de0gkiQWd_bFJRQaj/exec';
const S={boot:null,step:1,mentor:'',student:'',ratings:{},started:null};
const $=id=>document.getElementById(id);
function jsonp(action,payload){return new Promise((resolve,reject)=>{const cb='t3cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('หมดเวลาการเชื่อมต่อ'));},20000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=r=>{cleanup();r&&r.ok?resolve(r.data):reject(new Error((r&&r.error)||'unknown'))};s.onerror=()=>{cleanup();reject(new Error('เชื่อมต่อระบบไม่ได้'))};s.src=ENDPOINT+'?bridge=1&callback='+encodeURIComponent(cb)+'&action='+encodeURIComponent(action)+'&payload='+encodeURIComponent(JSON.stringify(payload||{}))+'&t='+Date.now();document.head.appendChild(s);});}
function stepbar(){ $('steps').innerHTML=[1,2,3,4,5].map((n,i)=>'<div class="step '+(n===S.step?'on':n<S.step?'done':'')+'">'+(i+1)+') '+['เลือกครูพี่เลี้ยง','นักศึกษา','แบบประเมิน','ตรวจสอบ','ส่งผล'][i]+'</div>').join('');}
function go(n){S.step=n;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$('s'+n).classList.add('on');stepbar();scrollTo({top:0,behavior:'smooth'});}
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderMentors(f=''){const q=f.trim().toLowerCase();const ms=S.boot.mentors.filter(m=>!q||m.mentor_code.toLowerCase().includes(q)||m.mentor_name.toLowerCase().includes(q));$('mentors').innerHTML=ms.map(m=>'<div class="mentor-row" data-c="'+m.mentor_code+'"><span><b>'+m.mentor_code+'</b> · '+esc(m.mentor_name)+'</span><span class="help">'+esc(m.subject_major)+'</span></div>').join('');document.querySelectorAll('.mentor-row').forEach(r=>r.onclick=()=>chooseMentor(r.dataset.c));}
async function chooseMentor(code){S.mentor=code;S.student='';S.ratings={};const m=S.boot.mentors.find(x=>x.mentor_code===code);$('chosen').innerHTML='<b>'+code+'</b> · '+esc(m.mentor_name);$('student').innerHTML='<option>กำลังโหลด...</option>';go(2);try{const ss=await jsonp('students',{mentor_code:code});$('student').innerHTML='<option value="">— เลือกนักศึกษา —</option>'+ss.map(s=>'<option value="'+s.student_id+'">'+s.student_id+' · '+esc(s.student_name)+' · '+esc(s.program)+'</option>').join('');}catch(e){$('student').innerHTML='<option value="">โหลดข้อมูลไม่สำเร็จ</option>';$('dup').textContent=e.message}}
$('search').oninput=e=>renderMentors(e.target.value);
$('student').onchange=async e=>{S.student=e.target.value;S.started=S.student?new Date().toISOString():null;$('to3').disabled=!S.student;$('dup').textContent='';if(S.student)try{const r=await jsonp('submission_exists',{mentor_code:S.mentor,student_id:S.student});if(r.exists)$('dup').textContent='เคยส่งแล้ว '+r.revisions+' ครั้ง · รายการใหม่จะเป็นฉบับแก้ไข';}catch(_){}};
$('to3').onclick=()=>{renderRubric();go(3);progress();};
function renderRubric(){const g={};S.boot.rubric.forEach(it=>{const k=it.domain+'|'+it.competency+'|'+it.competency_name;(g[k]??=[]).push(it)});$('rubric').innerHTML=Object.entries(g).map(([k,its])=>'<div class="card sec"><h3>ด้านที่ '+its[0].domain+' · '+esc(its[0].competency)+' '+esc(its[0].competency_name)+'</h3>'+its.map(it=>'<div class="item"><div><span class="qcode">'+it.item_code+'</span> '+esc(it.exact_item_text)+'<div class="help">ที่มา: หน้า '+esc(it.source_page)+'</div></div><div class="scale" data-c="'+it.item_code+'">'+[1,2,3,4].map(v=>'<button type="button" data-v="'+v+'">'+v+'</button>').join('')+'</div></div>').join('')+'</div>').join('');document.querySelectorAll('.scale button').forEach(b=>b.onclick=()=>{const p=b.parentElement;S.ratings[p.dataset.c]=Number(b.dataset.v);p.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));progress();});}
function progress(){let w=0,c=0;Object.entries(S.ratings).forEach(([q,v])=>{const n=Number(q.slice(1));if(n<=15)w+=v;else c+=v});$('rated').textContent=Object.keys(S.ratings).length;$('work').textContent=w+'/60';$('conduct').textContent=c+'/40';$('total').textContent=(w+c)+'/100';$('to4').disabled=Object.keys(S.ratings).length!==25;}
$('to4').onclick=()=>{const m=S.boot.mentors.find(x=>x.mentor_code===S.mentor);$('rvMentor').textContent=S.mentor+' · '+m.mentor_name;$('rvStudent').textContent=$('student').selectedOptions[0].text;const total=Object.values(S.ratings).reduce((a,b)=>a+b,0);$('rvTotal').textContent=total+' / 100';$('rvAvg').textContent=(total/25).toFixed(2)+' / 4.00';go(4);};
$('cert').onchange=()=>{$('submit').disabled=!$('cert').checked};
$('submit').onclick=()=>{if(!$('cert').checked)return;$('submit').disabled=true;$('msg').textContent='กำลังบันทึก...';const payload={mentor_code:S.mentor,student_id:S.student,ratings:S.ratings,certified:true,started_at:S.started,user_agent:navigator.userAgent||''};const f=$('bridgeForm');f.action=ENDPOINT;f.innerHTML='<input name="bridge_submit" value="1"><input name="payload">';f.querySelector('[name=payload]').value=JSON.stringify(payload);f.submit();setTimeout(()=>{if(S.step===4){$('msg').textContent='กำลังรอการยืนยันจากระบบ...';}},3000);};
window.addEventListener('message',e=>{const d=e.data;if(!d||d.source!=='T3_KRU_EVAL')return;const r=d.result||{};if(r.ok){$('done').textContent='รหัสรายการ '+r.submission_id+' · คะแนน '+r.total_score+'/100 · ค่าเฉลี่ย '+Number(r.average_score).toFixed(2);go(5);}else{$('msg').textContent='บันทึกไม่สำเร็จ: '+(r.error||'unknown');$('submit').disabled=false;}});
(async()=>{stepbar();try{S.boot=await jsonp('boot',{});$('school').textContent=S.boot.schoolLabel;$('certText').textContent=S.boot.certificationText;renderMentors();}catch(e){$('school').textContent='เชื่อมต่อระบบไม่ได้: '+e.message;}})();
</script>
</body></html>
