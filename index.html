const STATIC_STUDENTS={"T3M004":[{"student_id":"T3S001","student_name":"นางสาวปภัสสร ลิ้มไพเราะ","program":"คณิตศาสตร์","major":"คณิตศาสตร์"}],"T3M006":[{"student_id":"T3S002","student_name":"นางสาวชฎาทิพย์ คำริด","program":"คณิตศาสตร์","major":"คณิตศาสตร์"}],"T3M005":[{"student_id":"T3S003","student_name":"นางสาวสุรีรัตน์ นาระต๊ะ","program":"คณิตศาสตร์","major":"คณิตศาสตร์"}],"T3M008":[{"student_id":"T3S004","student_name":"นายทัตพงศ์ มากดี","program":"ภาษาอังกฤษ","major":"ภาษาอังกฤษ"}],"T3M010":[{"student_id":"T3S005","student_name":"นายนพดล สีทัน","program":"ภาษาอังกฤษ","major":"ภาษาอังกฤษ"}],"T3M009":[{"student_id":"T3S006","student_name":"นายปริพนธ์ ยอดจันทร์","program":"ภาษาอังกฤษ","major":"ภาษาอังกฤษ"}],"T3M001":[{"student_id":"T3S007","student_name":"นางสาวนภัสสร อินสิงห์ทอง","program":"การประถมศึกษา","major":"การประถมศึกษา"}],"T3M003":[{"student_id":"T3S008","student_name":"นางสาวสิราวรรณ คงเมือง","program":"การประถมศึกษา","major":"การประถมศึกษา"}],"T3M002":[{"student_id":"T3S009","student_name":"นางสาวสุภศิริ หมีแช","program":"การประถมศึกษา","major":"การประถมศึกษา"}],"T3M007":[{"student_id":"T3S010","student_name":"นายชลากร สุดใจ","program":"พลศึกษา","major":"พลศึกษา"},{"student_id":"T3S011","student_name":"นายไพรัตน์ กัลยาสาย","program":"พลศึกษา","major":"พลศึกษา"}],"T3M014":[{"student_id":"T3S012","student_name":"นางสาวกฤติยาภรณ์ ทุมมา","program":"วิทยาศาสตร์ทั่วไป","major":"วิทยาศาสตร์ทั่วไป"},{"student_id":"T3S013","student_name":"นางสาวอริศรา ปั่นเนตร","program":"วิทยาศาสตร์ทั่วไป","major":"วิทยาศาสตร์ทั่วไป"}],"T3M011":[{"student_id":"T3S014","student_name":"นางสาวณัฐนันท์ อินทรฤทธิ์","program":"ภาษาไทย","major":"ภาษาไทย"}],"T3M013":[{"student_id":"T3S015","student_name":"นางสาวอมรรัตน์ โท้อยู่","program":"ภาษาไทย","major":"ภาษาไทย"}],"T3M012":[{"student_id":"T3S016","student_name":"นายกฤษณะ ม้าทอง","program":"ภาษาไทย","major":"ภาษาไทย"}],"T3M015":[{"student_id":"T3S056","student_name":"นางสาววิมาดา อังศุเกษตร","program":"วิทยาศาสตร์ศึกษา","major":"วิทยาศาสตร์ศึกษา"},{"student_id":"T3S057","student_name":"นางสาวสุปราณี ศักดิ์ศิริกุล","program":"วิทยาศาสตร์ศึกษา","major":"วิทยาศาสตร์ศึกษา"}]};
const S={boot:STATIC_BOOT,step:1,mentor:'',student:'',ratings:{},started:null,submitted:false};
const $=id=>document.getElementById(id);
function jsonp(action,payload){return new Promise((resolve,reject)=>{const cb='t3cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('หมดเวลาการเชื่อมต่อ'));},20000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=r=>{cleanup();r&&r.ok?resolve(r.data):reject(new Error((r&&r.error)||'unknown'))};s.onerror=()=>{cleanup();reject(new Error('เชื่อมต่อระบบไม่ได้'))};s.src=ENDPOINT+'?bridge=1&callback='+encodeURIComponent(cb)+'&action='+encodeURIComponent(action)+'&payload='+encodeURIComponent(JSON.stringify(payload||{}))+'&t='+Date.now();document.head.appendChild(s);});}
function canGoStep(n){
  if(n===1)return true;
  if(n===2)return !!S.mentor;
  if(n===3)return !!S.student;
  if(n===4)return Object.keys(S.ratings).length===25;
  if(n===5)return !!S.submitted;
  return false;
}
function navStep(n){
  if(!canGoStep(n))return;
  if(n===3){
    updateEvalContext();
    if(!document.querySelector('#rubric .scale')) renderRubric();
    progress();
  }
  if(n===4)prepareReview();
  go(n);
}
function stepbar(){
  const labels=['เลือกครูพี่เลี้ยง','นักศึกษา','แบบประเมิน','ตรวจสอบ','ส่งผล'];
  $('steps').innerHTML=[1,2,3,4,5].map((n,i)=>{
    const cls='step '+(n===S.step?'on':n<S.step?'done':'');
    const dis=canGoStep(n)?'':' disabled';
    const title=canGoStep(n)?'คลิกเพื่อไปขั้นตอนนี้':'ต้องทำขั้นตอนก่อนหน้าให้ครบ';
    return '<button type="button" class="'+cls+'" data-step="'+n+'" title="'+title+'"'+dis+'>'+(i+1)+') '+labels[i]+'</button>';
  }).join('');
  document.querySelectorAll('#steps .step').forEach(b=>b.onclick=()=>navStep(Number(b.dataset.step)));
}
function go(n){S.step=n;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$('s'+n).classList.add('on');stepbar();scrollTo({top:0,behavior:'smooth'});}
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderMentors(f=''){const q=f.trim().toLowerCase();const ms=S.boot.mentors.filter(m=>!q||m.mentor_code.toLowerCase().includes(q)||m.mentor_name.toLowerCase().includes(q));$('mentors').innerHTML=ms.map(m=>'<div class="mentor-row" data-c="'+m.mentor_code+'"><span><b>'+m.mentor_code+'</b> · '+esc(m.mentor_name)+'</span><span class="help">'+esc(m.subject_major)+'</span></div>').join('');document.querySelectorAll('.mentor-row').forEach(r=>r.onclick=()=>chooseMentor(r.dataset.c));}
function chooseMentor(code){S.mentor=code;S.student='';S.ratings={};const m=S.boot.mentors.find(x=>x.mentor_code===code);$('chosen').innerHTML='<b>'+code+'</b> · '+esc(m.mentor_name);const ss=STATIC_STUDENTS[code]||[];$('student').innerHTML='<option value="">— เลือกนักศึกษา —</option>'+ss.map(s=>'<option value="'+s.student_id+'">'+s.student_id+' · '+esc(s.student_name)+' · '+esc(s.program)+'</option>').join('');$('dup').textContent=ss.length?'':'ไม่พบนักศึกษาที่จับคู่กับครูพี่เลี้ยงรายนี้';go(2);}
$('search').oninput=e=>renderMentors(e.target.value);
$('student').onchange=async e=>{S.student=e.target.value;S.started=S.student?new Date().toISOString():null;$('to3').disabled=!S.student;stepbar();$('dup').textContent='';if(S.student)try{const r=await jsonp('submission_exists',{mentor_code:S.mentor,student_id:S.student});if(r.exists)$('dup').textContent='เคยส่งแล้ว '+r.revisions+' ครั้ง · รายการใหม่จะเป็นฉบับแก้ไข';}catch(_){}};
$('to3').onclick=()=>{updateEvalContext();renderRubric();go(3);progress();};
function updateEvalContext(){
  const m=S.boot.mentors.find(x=>x.mentor_code===S.mentor);
  const ss=STATIC_STUDENTS[S.mentor]||[];
  const st=ss.find(x=>x.student_id===S.student);
  $('evalMentorName').textContent=m?m.mentor_name:'—';
  $('evalMentorMeta').textContent=m?(m.mentor_code+(m.subject_major?' · '+m.subject_major:'')):'';
  $('evalStudentName').textContent=st?st.student_name:'—';
  $('evalStudentMeta').textContent=st?(st.student_id+(st.program?' · '+st.program:'')):'';
}
function renderRubric(){const g={};S.boot.rubric.forEach(it=>{const k=it.domain+'|'+it.competency+'|'+it.competency_name;(g[k]??=[]).push(it)});$('rubric').innerHTML=Object.entries(g).map(([k,its])=>'<div class="card sec"><h3>ด้านที่ '+its[0].domain+' · '+esc(its[0].competency)+' '+esc(its[0].competency_name)+'</h3>'+its.map(it=>'<div class="item"><div><span class="qcode">'+it.item_code+'</span> '+esc(it.exact_item_text)+'<div class="help">ที่มา: หน้า '+esc(it.source_page)+'</div></div><div class="scale" data-c="'+it.item_code+'">'+[1,2,3,4].map(v=>'<button type="button" data-v="'+v+'"><span class="num">'+v+'</span><span class="desc">'+['ต่ำมาก','ต่ำ','สูง','สูงมาก'][v-1]+'</span></button>').join('')+'</div></div>').join('')+'</div>').join('');document.querySelectorAll('.scale button').forEach(b=>b.onclick=()=>{const p=b.parentElement;S.ratings[p.dataset.c]=Number(b.dataset.v);p.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));progress();});}
function progress(){let w=0,c=0;Object.entries(S.ratings).forEach(([q,v])=>{const n=Number(q.slice(1));if(n<=15)w+=v;else c+=v});$('rated').textContent=Object.keys(S.ratings).length;$('work').textContent=w+'/60';$('conduct').textContent=c+'/40';$('total').textContent=(w+c)+'/100';$('to4').disabled=Object.keys(S.ratings).length!==25;stepbar();}
function prepareReview(){
  const m=S.boot.mentors.find(x=>x.mentor_code===S.mentor);
  $('rvMentor').textContent=S.mentor+' · '+(m?m.mentor_name:'');
  $('rvStudent').textContent=$('student').selectedOptions[0]?$(
    'student').selectedOptions[0].text:'';
  const total=Object.values(S.ratings).reduce((a,b)=>a+b,0);
  $('rvTotal').textContent=total+' / 100';
  $('rvAvg').textContent=(total/25).toFixed(2)+' / 4.00';
}
$('to4').onclick=()=>{prepareReview();go(4);};
$('cert').onchange=()=>{$('submit').disabled=!$('cert').checked};
$('submit').onclick=async()=>{if(!$('cert').checked)return;
  $('submit').disabled=true;
  $('msg').textContent='กำลังบันทึกผลการประเมิน...';
  const payload={mentor_code:S.mentor,student_id:S.student,ratings:S.ratings,certified:true,started_at:S.started,user_agent:navigator.userAgent||''};
  try{
    const r=await jsonp('submit',payload);
    S.submitted=true;
    $('done').textContent='รหัสรายการ '+r.submission_id+' · คะแนน '+r.total_score+'/100 · ค่าเฉลี่ย '+Number(r.average_score).toFixed(2);
    $('msg').textContent='';
    go(5);
  }catch(err){
    $('msg').textContent='บันทึกไม่สำเร็จ: '+String(err&&err.message||err)+' กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่';
    $('submit').disabled=false;
  }
};
(()=>{stepbar();$('school').textContent=S.boot.schoolLabel;$('certText').textContent=S.boot.certificationText;renderMentors();})();
</script>
